<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Careers | Arihant Offset Printers</title>

    <!-- Load Global Styles First -->
    <link rel="stylesheet" href="css/style.css" />
    <!-- Load Page-Specific Styles Second -->
    <link rel="stylesheet" href="css/careers.css" />
  </head>
  <body>
    <!-- Universal Header & Sidebar -->
    <div id="header-placeholder"></div>

    <!-- PAGE HERO SECTION -->
    <section class="page-hero">
      <div class="page-hero-bg"></div>
      <div class="container relative-z reveal">
        <h1 class="page-title">Careers</h1>
        <p class="breadcrumb">Home - Careers</p>
      </div>
    </section>

    <!-- CAREERS CONTENT SECTION -->
    <section class="careers-section">
      <div class="container">
        <div class="careers-grid">
          <!-- Left Side: Jobs List -->
          <div class="careers-main reveal">
            <h2>Careers</h2>

            <div class="jobs-list">
              <!-- Job Card 1 -->
              <div class="job-card">
                <div class="job-logo">
                  <!-- Update src to your orange M logo -->
                  <img src="images/arihant.png" alt="Company Logo" />
                </div>

                <div class="job-details">
                  <span class="job-type">FULL TIME</span>
                  <h3 class="job-title">Graphic Designer</h3>

                  <div class="job-meta">
                    <span>
                      <!-- Building Icon -->
                      <svg viewBox="0 0 24 24">
                        <path
                          d="M17 11V3H7v4H3v14h18V11h-4zM7 19H5v-2h2v2zm0-4H5v-2h2v2zm0-4H5V9h2v2zm4 8H9v-2h2v2zm0-4H9v-2h2v2zm0-4H9V9h2v2zm0-4H9V5h2v2zm4 12h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2zm0-4h-2V5h2v2zm4 12h-2v-2h2v2zm0-4h-2v-2h2v2z"
                        />
                      </svg>
                      Arihant Offset Printers
                    </span>
                    <span>
                      <!-- Location Pin Icon -->
                      <svg viewBox="0 0 24 24">
                        <path
                          d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"
                        />
                      </svg>
                      Raipur
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Right Side: Sidebar -->
          <div class="careers-sidebar reveal">
            <div class="sidebar-cta-box">
              <h3>How can we help you ?</h3>
              <p>
                If you would like to know how Arihant Offset Printer can help
                you, then please get in touch today.
              </p>
              <a href="contact.html" class="sidebar-cta-btn">CONTACT US</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Universal Footer -->
    <div id="footer-placeholder"></div>

    <!-- Universal JS -->
    <script src="js/main.js"></script>
  </body>
</html>
